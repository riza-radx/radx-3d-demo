<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Një karikim në RadX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23022636'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%237fbc42'%3EX%3C/text%3E%3C/svg%3E">
<style>
  /* ================= PALETA (ndryshoje vetem ketu) ================= */
  :root{
    --brand:#7fbc42;
    --brand-dk:#4e7a26;
    --teal:#00a3b9;      /* vlera e sakte e markes (PDF + piksel i pamjeve) */
    --navy:#022636;
    --navy-2:#08435d;    /* vlera e sakte e markes */
    --ink:#eaf4f7;
    --dim:#8fb0bb;
    --warn:#f0a33a;
    --bad:#ff7979;       /* vlera e sakte e markes */
    --card:rgba(2,38,54,.84);
    --line:rgba(143,176,187,.22);
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
    --sans:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{
    font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 90% at 42% 0%, #0b5566 0%, #04384d 42%, #022636 100%);
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .clickable{pointer-events:auto}

  /* ================= LOGO ================= */
  /* Logo: unaza me pika + fjala RADX, si te video-ja e brandit.
     Fonti origjinal (gjeometrik, A pa traversë) nuk e kemi — e afrojme me
     letter-spacing te hapur; teksti mbetet i bardhe, unaza gjithashtu. */
  .brandmark{position:absolute;top:24px;left:34px;display:flex;align-items:center;gap:11px}
  .rmark{width:1em;height:1em;fill:currentColor;flex:0 0 auto}
  .brandmark .rmark{font-size:27px;color:#fff}
  .brandmark b{font-size:23px;font-weight:600;letter-spacing:.09em;line-height:1}
  .brandmark span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

  /* ================= KARTA E KAPITULLIT ================= */
  .chapter{
    position:absolute;left:34px;bottom:32px;width:min(520px,40vw);
    background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:20px 24px 16px;backdrop-filter:blur(14px);
    box-shadow:0 24px 64px rgba(0,0,0,.45);
  }
  .chapter .step{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--teal);margin-bottom:9px;
  }
  .chapter .step b{color:var(--brand);font-weight:700}
  .chapter h1{font-size:28px;line-height:1.12;letter-spacing:-.4px;margin-bottom:9px}
  .chapter p{font-size:15.5px;line-height:1.52;color:#cfe3ea;min-height:5.6em}
  .chapter .tech{
    display:none;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:#6f97a4;
  }
  .chapter.showtech .tech{display:block}

  .navrow{display:flex;align-items:center;gap:12px;margin-top:16px}
  .navrow button{
    font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
    background:rgba(143,176,187,.12);border:1px solid var(--line);
    border-radius:9px;padding:8px 15px;cursor:pointer;transition:.15s;
  }
  @media (hover:hover){
    .navrow button:hover:not(:disabled){background:var(--brand);border-color:var(--brand);color:#0b2a06}
  }
  .navrow button:disabled{opacity:.3;cursor:default}
  .dots{
    display:flex;gap:5px;align-items:center;margin-top:15px;
    padding-top:13px;border-top:1px solid rgba(143,176,187,.14);
  }
  .dots i{
    width:6px;height:6px;border-radius:50%;background:rgba(143,176,187,.28);
    cursor:pointer;pointer-events:auto;transition:.2s;flex:0 0 auto;
  }
  .dots i.on{background:var(--brand);transform:scale(1.6)}
  .dots u{width:9px;display:block;flex:0 0 auto}

  /* ================= TELEFONI ================= */
  /* Seksioni RadX: telefoni largohet dhe skena merr gjithe ekranin.
     Vetem opacity + transform — layout-i nuk luan, keshtu portret/landscape
     kane nevoje vetem per transform-in e vet. */
  body.wide .phone{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(54px) scale(.97)}

  /* Telefoni tani ESHTE pamja e app-it: pamjet te assets/app/ permbajne edhe
     trupin e pajisjes, keshtu qelqi, notch-i dhe shiriti i vjeter u hoqen.
     Rregullat e vjetra te brendesise (.glass, .sbar, .appbar, .row, .pin …)
     mbeten ne CSS por nuk kane me element — nuk prekin gje. */
  .phone{
    position:absolute;right:40px;top:50%;transform:translateY(-50%);
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
    width:322px;height:648px;padding:0;background:none;border-radius:0;
    filter:drop-shadow(0 38px 60px rgba(0,0,0,.62));
  }

  /* Kutia me raportin e sakte te pamjes (978x2000). Shtresat e numrave live
     pozicionohen ne % te KESAJ kutie, jo te .phone — kështu nuk varen nga
     permasat e breakpoint-it. container-type e ben fontin te shkallohet. */
  .pscreen{
    position:absolute;inset:0;margin:auto;
    pointer-events:auto;cursor:pointer;
    aspect-ratio:489/1000;max-width:100%;max-height:100%;
    container-type:size;
  }
  .pimg{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    opacity:0;transition:opacity .45s ease;
    border-radius:16.9cqw;          /* rreze e matur nga SMask-i i PDF-se */
    border-radius:53px;             /* rezerve per browser pa cqw */
  }
  @supports (width:1cqw){ .pimg{border-radius:16.9cqw} }
  .pimg.on{opacity:1}

  /* Klikimi mbi harte: rreth teal qe zgjerohet e zbehet, si ripple-i i app-it.
     Pozicioni bie mbi njeren nga pinat e 01-harta.jpg. */
  .tapfx{
    position:absolute;left:46%;top:39.5%;width:15cqw;height:15cqw;margin:-7.5cqw 0 0 -7.5cqw;
    border:0.6cqw solid var(--teal);border-radius:50%;opacity:0;pointer-events:none;
    box-shadow:0 0 0 0.3cqw rgba(255,255,255,.5) inset;
  }
  .tapfx.go{animation:tapgo .66s ease-out forwards}
  @keyframes tapgo{
    0%  {opacity:.95;transform:scale(.3)}
    100%{opacity:0;  transform:scale(2.7)}
  }

  /* Rruga e dyte e nisjes. App-i real ka "Stop Charging"; "Start Charging"
     e vizatojme me te njejtin stil — navy i markes, tekst i bardhe. */
  /* Sfond i bardhe qe zbehet: butoni lexohet si shirit veprimi i app-it,
     jo si dicka e vendosur mbi permbajtjen. */
  .ov-start{
    left:0;bottom:0;width:100%;height:26%;top:auto;
    background:linear-gradient(to top, #fff 0%, #fff 52%, rgba(255,255,255,0) 100%);
    border-radius:0 0 16.9cqw 16.9cqw;   /* mos i prit qoshet e rrumbullakuara te ekranit */
  }
  .startbtn{
    position:absolute;left:8%;right:8%;bottom:20%;
    background:var(--navy-2);color:#fff;text-align:center;font-weight:700;
    font-size:4.6cqw;padding:3.5cqw 0;border-radius:3.4cqw;letter-spacing:.2px;
    box-shadow:0 1.6cqw 3.6cqw rgba(0,0,0,.34);
    transition:transform .16s ease, background .16s ease;
  }
  .startbtn.press{transform:scale(.93);background:var(--teal)}

  /* ================= FOTO E HAPIT 1 =================
     Frame nga video-ja e VEGA Charging (sek. 23). Duket vetem te kapitulli
     'person'; pastaj zbehet dhe zbulon skenen 3D me makinat. */
  #scrim{
    position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;
    background:rgba(2,38,54,.78);transition:opacity .6s ease;
  }
  #hero{
    position:absolute;left:34px;top:104px;width:min(520px,40vw);z-index:1;
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  }
  body.hero #scrim{opacity:1}
  body.hero #hero{opacity:1;transform:none}
  #hero img{
    display:block;width:100%;aspect-ratio:720/466;object-fit:cover;object-position:50% 32%;
    border-radius:14px;border:1px solid var(--line);
    box-shadow:0 26px 60px rgba(0,0,0,.52);
  }
  #hero b{
    display:block;margin-top:9px;font-family:var(--mono);font-size:11px;font-weight:400;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  }

  /* --- Shtresa e karikimit: mbulon ishullin e zi dhe e rishkruan me numra
         qe rrjedhin. Zona nga 8% ne 29% e lartesise eshte #000000 e plote
         (matur me skanim pikselesh), keshtu buzet nuk dallohen. --- */
  .ov{position:absolute;opacity:0;transition:opacity .3s;pointer-events:none}
  .ov.on{opacity:1}

  .ov-charge{
    left:7%;width:86%;top:8%;height:21%;
    background:#000;color:#fff;font-weight:700;
  }
  .ov-big{
    position:absolute;left:5%;top:24%;
    font-size:16px;font-size:5.1cqw;letter-spacing:-.4px;line-height:1;white-space:nowrap;
  }
  .ov-sub{
    position:absolute;left:5%;top:47%;
    font-size:7px;font-size:2.2cqw;font-weight:500;color:#d7dee1;white-space:nowrap;
  }
  .ov-ring{position:absolute;right:5%;top:12%;width:20%;aspect-ratio:1}
  .ov-btn{
    position:absolute;left:5%;right:5%;bottom:3%;height:23%;
    background:#07435d;border-radius:999px;display:grid;place-items:center;
    font-size:8px;font-size:2.6cqw;letter-spacing:.2px;
  }

  /* --- Shtresa e fundit: mbulon vetem rreshtin e vlerave te kartes se bardhe.
         Etiketat mbi te (Energy deliverd / Total Payed) mbeten te pamjes. --- */
  .ov-done{
    left:11.5%;width:67%;top:71.4%;height:3.4%;
    background:#fff;display:grid;grid-template-columns:68% 32%;align-items:center;
  }
  .ov-done b{
    font-size:13px;font-size:4.1cqw;font-weight:600;color:#08435d;
    letter-spacing:-.3px;line-height:1;white-space:nowrap;
  }
  .phone .glass{
    position:relative;width:100%;height:100%;border-radius:33px;overflow:hidden;
    background:#061b24;
  }
  .phone .notch{
    position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:96px;height:22px;border-radius:12px;background:#050f14;z-index:6;
  }
  .sbar{
    position:absolute;top:0;left:0;right:0;height:40px;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:11.5px;font-family:var(--mono);color:#cfe3ea;
  }
  .sbar .rt{display:flex;gap:6px;align-items:center}
  .sbar .bat{width:20px;height:10px;border:1.4px solid #cfe3ea;border-radius:3px;position:relative}
  .sbar .bat::after{content:'';position:absolute;inset:1.6px;right:5px;background:#cfe3ea;border-radius:1px}

  .appbar{
    position:absolute;top:40px;left:0;right:0;height:46px;z-index:4;
    display:flex;align-items:center;gap:9px;padding:0 18px;
    border-bottom:1px solid rgba(143,176,187,.14);
  }
  .appbar b{font-size:15px;font-weight:700}
  .appbar b i{color:var(--brand);font-style:normal}
  .appbar span{margin-left:auto;font-size:11px;color:var(--dim)}

  .screens{position:absolute;top:86px;left:0;right:0;bottom:0;z-index:3}
  .scr{
    position:absolute;inset:0;padding:16px 18px;
    opacity:0;transform:translateY(10px);transition:.4s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;overflow:hidden;
  }
  .scr.on{opacity:1;transform:none}

  .h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:11px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
        padding:4px 10px;border-radius:999px;background:rgba(127,188,66,.16);color:var(--brand)}
  .pill.t{background:rgba(16,162,172,.18);color:#4fd3dd}
  .pill.w{background:rgba(240,163,58,.18);color:var(--warn)}
  .pill.b{background:rgba(226,86,74,.18);color:#ff8a7e}

  .row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:13px;color:var(--dim)}
  .row b{font-family:var(--mono);font-size:14.5px;color:var(--ink);font-weight:600}
  .row.big b{font-size:22px}
  .sep{height:1px;background:rgba(143,176,187,.16);margin:10px 0}

  .btn{
    display:block;width:100%;text-align:center;margin-top:14px;
    background:var(--brand);color:#0b2a06;font-weight:800;font-size:15px;
    padding:14px;border-radius:13px;box-shadow:0 10px 26px rgba(127,188,66,.28);
  }
  .btn.ghost{background:rgba(143,176,187,.13);color:var(--ink);box-shadow:none;font-weight:700}

  /* harta */
  .map{position:absolute;inset:0;background:
      linear-gradient(rgba(143,176,187,.07) 1px,transparent 1px) 0 0/100% 46px,
      linear-gradient(90deg,rgba(143,176,187,.07) 1px,transparent 1px) 0 0/46px 100%,
      #08222c}
  .map .road{position:absolute;background:rgba(143,176,187,.13)}
  .pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 4px;
       transform:rotate(-45deg);display:grid;place-items:center;
       box-shadow:0 5px 14px rgba(0,0,0,.45)}
  .pin s{transform:rotate(45deg);font-size:11px;font-weight:800;text-decoration:none}
  .pin.free{background:var(--brand);color:#0b2a06}
  .pin.busy{background:#3f6472;color:#cfe3ea}
  .pin.me{background:var(--teal);color:#02252a;width:32px;height:32px;animation:beat 1.8s infinite}
  @keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.12)}}
  .maptop{position:absolute;top:12px;left:14px;right:14px;z-index:2;
          background:rgba(4,34,44,.9);border:1px solid var(--line);border-radius:11px;
          padding:9px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  .mapbot{position:absolute;bottom:14px;left:14px;right:14px;z-index:2;
          background:#04222c;border:1px solid var(--line);border-radius:13px;padding:12px 14px}

  /* bateria rrethore */
  .ring{position:relative;width:158px;height:158px;margin:2px auto 10px}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .mid b{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-2px;display:block;line-height:1}
  .ring .mid span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  /* checks */
  .chk{display:flex;align-items:center;gap:11px;padding:11px 0;font-size:13.5px;
       opacity:.25;transition:.45s}
  .chk.ok{opacity:1}
  .chk em{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:grid;place-items:center;
          background:rgba(143,176,187,.16);font-style:normal;font-size:12px;font-weight:800;color:var(--dim);transition:.45s}
  .chk.ok em{background:var(--brand);color:#0b2a06}
  .chk u{text-decoration:none;color:var(--dim);font-size:11.5px;display:block}

  /* njoftim push */
  .push{
    background:#0c2f3c;border:1px solid rgba(127,188,66,.4);border-radius:14px;
    padding:13px 14px;box-shadow:0 12px 30px rgba(0,0,0,.4);
    animation:drop .5s cubic-bezier(.2,.9,.2,1);
  }
  @keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
  .push b{display:block;font-size:13.5px;margin-bottom:4px}
  .push span{font-size:12.5px;color:#b7d2db;line-height:1.45}
  .push span b{display:inline;font-weight:700;color:#eaf4f7}

  /* shirita ndarjeje fuqie */
  .sh{margin:9px 0}
  .sh .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
  .sh .lb b{font-family:var(--mono);color:var(--ink)}
  .sh .tr{height:9px;border-radius:6px;background:rgba(143,176,187,.15);overflow:hidden}
  .sh .tr i{display:block;height:100%;border-radius:6px;transition:width .7s}

  /* fatura */
  .inv{background:#f6fafb;color:#0b2733;border-radius:13px;padding:15px}
  .inv .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5d7580;margin-bottom:9px}
  .inv .r{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:#3c5560}
  .inv .r b{font-family:var(--mono);color:#0b2733}
  .inv .tot{margin-top:9px;padding-top:9px;border-top:2px solid #0b2733;font-size:14px}
  .inv .tot b{font-size:20px}

  /* ================= NDIHMA E TASTIERES ================= */
  .keys{position:absolute;left:34px;top:64px;font-size:11.5px;color:var(--dim);line-height:1.85;opacity:.75}
  .keys kbd{font-family:var(--mono);font-size:10.5px;background:rgba(143,176,187,.14);
            border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink)}

  .draghint{
    position:absolute;left:calc(50% - 190px);bottom:52px;transform:translateX(-50%);
    background:var(--brand);color:#0b2a06;font-weight:800;font-size:15.5px;
    padding:12px 24px;border-radius:999px;box-shadow:0 14px 40px rgba(127,188,66,.42);
    opacity:0;transition:.35s;white-space:nowrap;
  }
  .draghint.show{opacity:1}
  .draghint.done{background:var(--teal);color:#02252a;box-shadow:0 14px 40px rgba(16,162,172,.42)}

  #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--navy);transition:opacity .6s}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .block{display:flex;align-items:center;gap:16px;justify-content:center}
  #boot .rmark{font-size:44px;color:#fff}
  #boot b{font-size:40px;font-weight:600;letter-spacing:.1em;line-height:1}
  /* Tagline-i i video-s, me shkelqimin e vet. */
  #boot p.tag{
    margin-top:16px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;
    color:#eaf4f7;text-align:center;
    text-shadow:0 0 26px rgba(234,244,247,.55), 0 0 60px rgba(0,163,185,.45);
  }

  /* butoni i ekranit të plotë — vetëm në pajisje me prekje */
  .fs{
    display:none;position:absolute;top:14px;right:14px;width:42px;height:42px;
    place-items:center;font-size:17px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    backdrop-filter:blur(10px);cursor:pointer;
  }

  @media (max-width:1280px) and (orientation:landscape){
    .phone{width:280px;height:562px;right:22px}
    .chapter{width:min(430px,38vw)}
  }

  /* ======================= MOBILE - te perbashketa ======================= */
  @media (orientation:portrait) and (max-width:1100px),
         (orientation:landscape) and (max-height:520px){
    .keys{display:none}
    .fs{display:grid}
    .brandmark{top:13px;left:16px;gap:8px}
    .brandmark .rmark{font-size:21px}
    .brandmark b{font-size:18px}
    .brandmark span{display:none}

    .phone{width:262px;right:auto;padding:0}
    .phone .glass{border-radius:27px}
    .phone .notch{width:74px;height:17px;top:7px}
    .sbar{height:32px;padding:0 15px;font-size:10.5px}
    .appbar{top:32px;height:39px;padding:0 14px}
    .appbar b{font-size:14px}
    .screens{top:71px}
    .scr{padding:12px 14px}
    .h{margin-bottom:8px}
    .row{padding:5px 0}
    .ring{transform:scale(.78);transform-origin:top center;margin:0 auto -28px}
    .btn{margin-top:10px;padding:11px;font-size:14px}
    .sep{margin:8px 0}
    .mapbot{padding:10px 12px}

    .navrow .w{display:none}
    .navrow button{min-width:46px;min-height:46px;padding:0 13px;font-size:18px;font-weight:700}
    .dots{display:none}
    .draghint{left:50%;font-size:14px;padding:11px 20px}

    /* Teksti: shirit i mbyllur, hapet me tap. Ne mobile skena dhe telefoni
       kane perparesi mbi tekstin — teksti lexohet kur e kerkon lexuesi. */
    .chapter{
      max-height:64px;overflow:hidden;padding:11px 16px 12px;
      transition:max-height .28s cubic-bezier(.2,.8,.2,1);
    }
    .chapter .step{font-size:10px;margin-bottom:3px}
    .chapter h1{
      font-size:17px;letter-spacing:-.2px;margin:0;padding-right:112px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .chapter.open h1{white-space:normal;padding-right:0;margin-bottom:8px}
    .chapter p{display:none}

function makeScreen(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 208;
  const x = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; track.push(tex);
  let last = '';
  const draw = (label, value, accent, id) => {
    const sig = [label,value,accent,id].join('|'); if (sig === last) return; last = sig;
    x.fillStyle = '#04222c'; x.fillRect(0,0,256,208);
    x.fillStyle = accent;    x.fillRect(0,0,256,7);
    x.fillStyle = '#7d9aa4'; x.font = '600 16px sans-serif'; x.fillText(id, 18, 36);
    x.fillStyle = accent;    x.font = '700 27px sans-serif'; x.fillText(label, 18, 92);
    x.fillStyle = '#eaf4f7'; x.font = '700 26px monospace';  x.fillText(value, 18, 142);
    x.fillStyle = '#456975'; x.font = '600 15px sans-serif'; x.fillText('RadX', 18, 186);
    tex.needsUpdate = true;
  };
  const m = new THREE.MeshBasicMaterial({ map:tex, toneMapped:false }); track.push(m);
  return { draw, material:m };
}

}

  const port = cyl(0.10,0.10,0.05,18,MAT.shellDk,-0.97,0.88,0.60,g);
  port.rotation.z = Math.PI/2;
  g.updateMatrixWorld(true);

  const ringMat = new THREE.MeshBasicMaterial({ color:P.brand, transparent:true, opacity:0, side:THREE.DoubleSide });

  ring.position.copy(port.position); ring.position.x -= 0.16; g.add(ring);

  const markMat = new THREE.MeshBasicMaterial({ color:P.brand, transparent:true, opacity:0 });

  mark.add(cone, stem);
  mark.position.copy(port.position); mark.position.x -= 0.14; g.add(mark);

  return { group:g, portWorld, ring, ringMat, mark, markMat };

const lastPlug = new THREE.Vector3(1e9,0,0);
function refreshCable(force=false){
  if (!force && lastPlug.distanceToSquared(plugPos) < 2e-5) return;
  lastPlug.copy(plugPos);
  const a = stations[0].outlet, b = plugPos;
  const sag = Math.min(0.55, 0.16 + a.distanceTo(b)*0.14);
  cableCurve = new THREE.CatmullRomCurve3([
    a,
    a.clone().lerp(b,0.34).add(new THREE.Vector3(0,-sag,0)),
    a.clone().lerp(b,0.68).add(new THREE.Vector3(0,-sag*0.72,0)),
    b,
  ]);
  const g = new THREE.TubeGeometry(cableCurve, SMALL ? 28 : 44, 0.035, SMALL ? 8 : 10, false);
  if (cableMesh){ cableMesh.geometry.dispose(); cableMesh.geometry = g; }
  else { cableMesh = new THREE.Mesh(g, cableMat); cableMesh.castShadow = true; scene.add(cableMesh); }
}

/* ---- Faqet e panelit ----
   Ne seksionin RadX telefoni largohet dhe paneli behet kryesori, keshtu i duhet
   me shume nga nje faqe. Cdo faqe vizatohet me canvas: pa asete, teksti i madh
   sa lexohet ne projektor, dhe ndryshimi i faqes kushton vetem nje texture swap.
   Gjuha e faqeve mbetet e njejta si e kapitujve — pa terma teknike. */
const PANEL_W = 1600, PANEL_H = 900;
const PANEL_INK = '#022636', PANEL_DIM = '#7b939c', PANEL_EDGE = '#dfe7ea';
const PANEL_OK = '#4e7a26', PANEL_WARN = '#b06f10';

function drawPage(x, p){
  x.fillStyle = '#f2f6f8'; x.fillRect(0, 0, PANEL_W, PANEL_H);

  /* shiriti i marks */
  x.fillStyle = p.brand || '#10a2ac'; x.fillRect(0, 0, PANEL_W, 74);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillStyle = '#fff'; x.font = '600 30px sans-serif';
  x.fillText(p.app || 'RadX · Paneli i rrjetit', 40, 48);
  if (p.pageName){
    x.textAlign = 'right'; x.font = '500 26px sans-serif';
    x.fillText(p.pageName, PANEL_W - 40, 47); x.textAlign = 'left';
  }

  /* fjalia kryesore — kjo mban peshen e faqes */
  x.fillStyle = PANEL_INK; x.fillRect(40, 104, 1520, 86);
  x.fillStyle = '#fff'; x.font = '600 34px sans-serif';
  x.fillText(p.headline, 66, 160);

  /* Karta e kapitullit ze qoshen poshte-majtas te ekranit. Ne distancat e
     seksionit RadX kjo mbulon cdo gje nen ~y 700 te panelit, keshtu faqja
     mbaron atje: maks 4 rreshta dhe asnje tekst ne fund. */
  let y = 252;
  if (p.cards){
    const n = p.cards.length, gap = 20, cw = (1520 - gap * (n - 1)) / n;
    p.cards.forEach(([k, v, col], i) => {
      const px = 40 + i * (cw + gap);
      x.fillStyle = '#fff'; x.fillRect(px, y, cw, 124);
      x.strokeStyle = PANEL_EDGE; x.lineWidth = 1; x.strokeRect(px, y, cw, 124);
      x.fillStyle = PANEL_DIM; x.font = '500 19px sans-serif'; x.fillText(k, px + 20, y + 36);
      x.fillStyle = col || PANEL_INK; x.font = '700 40px monospace'; x.fillText(v, px + 20, y + 94);
    });
    y += 148;
  }

  if (p.note){
    x.fillStyle = '#e9eff2'; x.fillRect(0, 706, PANEL_W, PANEL_H - 706);
    x.strokeStyle = PANEL_EDGE; x.beginPath(); x.moveTo(0, 706); x.lineTo(PANEL_W, 706); x.stroke();
    x.textAlign = 'right'; x.fillStyle = '#5b7783'; x.font = '400 28px sans-serif';
    x.fillText(p.note, PANEL_W - 44, 806); x.textAlign = 'left';
  }

  if (p.rows){
    const step = 56, boxH = 70 + p.rows.length * step;
    x.fillStyle = '#fff'; x.fillRect(40, y, 1520, boxH);
    x.strokeStyle = PANEL_EDGE; x.strokeRect(40, y, 1520, boxH);
    if (p.rowsTitle){
      x.fillStyle = PANEL_INK; x.font = '600 27px sans-serif'; x.fillText(p.rowsTitle, 68, y + 42);
    }
    const top = y + (p.rowsTitle ? 92 : 52);
    p.rows.forEach(([a, b, tag, col], i) => {
      const ry = top + i * step;
      x.fillStyle = PANEL_INK; x.font = '500 27px sans-serif'; x.fillText(a, 68, ry);
      if (b){ x.fillStyle = PANEL_DIM; x.font = '400 23px sans-serif'; x.fillText(b, 780, ry); }
      if (tag){
        x.textAlign = 'right'; x.fillStyle = col || PANEL_OK;
        x.font = '700 25px monospace'; x.fillText(tag, 1532, ry); x.textAlign = 'left';
      }
      if (i < p.rows.length - 1){
        x.strokeStyle = '#eef3f5'; x.beginPath();
        x.moveTo(68, ry + 22); x.lineTo(1532, ry + 22); x.stroke();
      }
    });
  }

}

/* ===================== PANELI NE PORTRET =====================
   Ne portret paneli 16:9 del 51–70% i gjeresise dhe teksti i rreshtave bie ne
   3.7–5.1px: i palexueshem. Zmadhimi i kameres nuk e zgjidh — paneli i gjere
   thjesht nuk i pershtatet ekranit te larte, dhe px-et e shtuar shkojne ne
   gjeresi ku nuk ka nevoje. Keshtu ne portret paneli behet i larte
   (1000x1560) dhe permbajtja rirreshtohet: kartat 2x2, nenrreshti poshte
   rreshtit, dy markat njera mbi tjetren. Faqja landscape nuk preket fare. */
const PORT_W = 1000, PORT_H = 1560;

/* Mbeshtjell tekstin ne rreshta brenda gjeresise. */
function wrapTx(x, text, maxW){
  const out = []; let line = '';
  for (const w of String(text).split(' ')){
    const t = line ? line + ' ' + w : w;
    if (line && x.measureText(t).width > maxW){ out.push(line); line = w; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}
/* Vendos fontin sa te hyje ne gjeresi — emrat dhe numrat ndryshojne gjatesi. */
function fitTx(x, text, maxW, size, weight, fam){
  let sz = size;
  x.font = weight + ' ' + sz + 'px ' + fam;
  while (sz > 14 && x.measureText(text).width > maxW){
    sz -= 2; x.font = weight + ' ' + sz + 'px ' + fam;
  }
  return sz;
}

function drawPagePortrait(x, p){
  const W = PORT_W, H = PORT_H, M = 30, IW = W - 2*M;
  x.fillStyle = '#f2f6f8'; x.fillRect(0, 0, W, H);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';

  /* shiriti i marks */
  x.fillStyle = p.brand || '#10a2ac'; x.fillRect(0, 0, W, 100);
  x.fillStyle = '#fff'; x.font = '600 36px sans-serif';
  x.fillText(p.app || 'RadX · Paneli i rrjetit', M, 64);
  if (p.pageName){
    x.textAlign = 'right'; x.font = '500 30px sans-serif';
    x.fillText(p.pageName, W - M, 63); x.textAlign = 'left';
  }

  /* fjalia kryesore — mbeshtjellet, sepse 1000px nuk mban nje rresht te vetem */
  x.font = '600 46px sans-serif';
  const hl = wrapTx(x, p.headline, IW - 52);
  const hlH = 30 + hl.length * 58;
  x.fillStyle = PANEL_INK; x.fillRect(M, 128, IW, hlH);
  x.fillStyle = '#fff';
  hl.forEach((l, i) => x.fillText(l, M + 26, 128 + 58 + i*58));
  let y = 128 + hlH + 30;

  /* Shiriti i fundit vizatohet i pari: rreshtat mbushin hapesiren deri tek ai,
     keshtu faqja nuk mbetet bosh ne fund. */
  let noteTop = H;
  if (p.note){
    x.font = '400 32px sans-serif';
    const nl = wrapTx(x, p.note, IW - 20);
    const bandH = 34 + nl.length * 44;
    noteTop = H - bandH;
    x.fillStyle = '#e9eff2'; x.fillRect(0, noteTop, W, bandH);
    x.strokeStyle = PANEL_EDGE; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0, noteTop); x.lineTo(W, noteTop); x.stroke();
    x.textAlign = 'right'; x.fillStyle = '#5b7783';
    nl.forEach((l, i) => x.fillText(l, W - M, noteTop + 52 + i*44));
    x.textAlign = 'left';
  }

  /* kartat: dy kolona */
  if (p.cards){
    const cw = (IW - 22)/2, ch = 152;
    p.cards.forEach(([k, v, col], i) => {
      const px = M + (i % 2)*(cw + 22), py = y + Math.floor(i/2)*(ch + 22);
      x.fillStyle = '#fff'; x.fillRect(px, py, cw, ch);
      x.strokeStyle = PANEL_EDGE; x.lineWidth = 1; x.strokeRect(px, py, cw, ch);
      x.fillStyle = PANEL_DIM; fitTx(x, k, cw - 44, 26, '500', 'sans-serif');
      x.fillText(k, px + 22, py + 48);
      x.fillStyle = col || PANEL_INK; fitTx(x, v, cw - 44, 54, '700', 'monospace');
      x.fillText(v, px + 22, py + 118);
    });
    y += Math.ceil(p.cards.length/2)*(ch + 22) + 10;
  }

  /* rreshtat: kutia mbush deri 26px mbi shiritin e fundit, ndarja barabar */
  if (p.rows){
    const boxH = Math.max(260, noteTop - 26 - y);
    x.fillStyle = '#fff'; x.fillRect(M, y, IW, boxH);
    x.strokeStyle = PANEL_EDGE; x.lineWidth = 1; x.strokeRect(M, y, IW, boxH);
    let bandTop = y + 24;
    if (p.rowsTitle){
      x.fillStyle = PANEL_INK; x.font = '600 34px sans-serif';
      x.fillText(p.rowsTitle, M + 26, y + 54);
      bandTop = y + 86;
    }
    const n = p.rows.length;
    const slot = Math.min(172, (y + boxH - 18 - bandTop)/Math.max(1, n));
    p.rows.forEach(([a, b, tag, col], i) => {
      const ry = Math.round(bandTop + i*slot + (slot - 78)/2 + 28);
      let tw = 0;
      if (tag){
        fitTx(x, tag, 320, 30, '700', 'monospace');
        tw = x.measureText(tag).width;
        x.textAlign = 'right'; x.fillStyle = col || PANEL_OK;
        x.fillText(tag, W - M - 26, ry); x.textAlign = 'left';
      }
      x.fillStyle = PANEL_INK;
      fitTx(x, a, IW - 72 - tw - (tag ? 22 : 0), 36, '600', 'sans-serif');
      x.fillText(a, M + 26, ry);
      if (b){
        x.fillStyle = PANEL_DIM; fitTx(x, b, IW - 72, 29, '400', 'sans-serif');
        x.fillText(b, M + 26, ry + 42);
      }
      if (i < n - 1){
        x.strokeStyle = '#eef3f5'; x.lineWidth = 1; x.beginPath();
        x.moveTo(M + 26, bandTop + (i+1)*slot); x.lineTo(W - M - 26, bandTop + (i+1)*slot); x.stroke();
      }
    });
  }
}

function dashboardTexturePortrait(){

    x.fillStyle = PANEL_DIM; fitTx(x, k, cw - 44, 26, '500', 'sans-serif');
    x.fillText(k, px + 22, py + 48);
    x.fillStyle = PANEL_INK; fitTx(x, v, cw - 44, 52, '700', 'monospace');
    x.fillText(v, px + 22, py + 118);
  });

  const gy = 594, gh = 386;
  x.fillStyle = '#fff'; x.fillRect(M, gy, IW, gh);
  x.strokeStyle = PANEL_EDGE; x.lineWidth = 1; x.strokeRect(M, gy, IW, gh);
  x.fillStyle = PANEL_INK; x.font = '600 32px sans-serif';
  x.fillText('Ngarkesa e rrjetit sot', M + 26, gy + 50);
  const pts = [.08,.13,.3,.34,.33,.55,.48,.5,.52,.42,.86,.88];
  const gx0 = M + 40, gx1 = W - M - 40, gBase = gy + gh - 46, gTop = gy + 100;
  const path = () => { x.beginPath(); pts.forEach((v, i) => {
    const px = gx0 + i*(gx1 - gx0)/(pts.length - 1), py = gBase - v*(gBase - gTop);
    i ? x.lineTo(px, py) : x.moveTo(px, py); }); };
  path(); x.lineTo(gx1, gBase); x.lineTo(gx0, gBase); x.closePath();
  x.fillStyle = 'rgba(16,162,172,.18)'; x.fill();
  path(); x.strokeStyle = '#10a2ac'; x.lineWidth = 5; x.stroke();

  x.fillStyle = PANEL_INK; x.font = '600 32px sans-serif';
  x.fillText('Shëndeti i rrjetit', M + 26, hy + 50);
  const rx = W/2, ry = hy + hh/2 + 30, rr = 104;
  x.beginPath(); x.arc(rx, ry, rr, -1.57, 4.0); x.strokeStyle = '#7fbc42'; x.lineWidth = 30; x.stroke();

function onChapter(i){
  const c = CHAPTERS[i], id = c.id || '';
  clearChapTimers();
  setScreen(c.screen);

  applyWide();
  if (c.panel) setPanelPage(c.panel);
  document.body.classList.toggle('hero', !!c.hero);

  /* Fazat e skenes. Kudo ku spina duhet te jete lidhur e sigurojme vete:
     prezantuesi mund te kercejne kapituj dhe skena nuk duhet te mbetet gabim. */
  if (id==='person' || id==='site' || id==='price'){ S.phase='idle'; S.ledTarget.setHex(0xffffff); }
  else if (id==='connect'){ S.phase='connect'; S.ledTarget.setHex(0x2f9bff); S.idle=0; }
  else if (id==='card'){ if (!S.connected) snapPlug(true);
                         S.phase='auth'; S.ledTarget.setHex(0x2f9bff);
                         S.cardT=0; S.cardOk=false; }
  else if (id==='appstart'){ if (!S.connected) snapPlug(true);
                             S.phase='start'; S.ledTarget.setHex(0x2f9bff); }
  else if (id==='charging' || id==='shared' || id==='problem'){
                             if (!S.connected) snapPlug(true);
                             S.phase='charging'; S.ledTarget.setHex(P.brand); }
  else if (id==='full'){ if (!S.connected) snapPlug(true);
                         S.phase='full'; S.soc=100; S.kwh=Math.max(S.kwh,(100-SOC_START)/100*BATTERY);
                         S.ledTarget.setHex(P.warn); }
  else if (id==='paid' || id==='invoice' || id==='panel'){ S.phase='done'; S.ledTarget.setHex(0x2f9bff); }
  /* Ne seksionin RadX rrjeti duhet te dukej i gjalle poshte panelit, jo i fjetur. */
  else { S.phase='charging'; S.ledTarget.setHex(P.brand); }

  /* Kapitujt me rrjedhe brenda vetes. */
  if (id==='person'){ tapUsed = false; after(2400, phoneTap); }
  if (id==='appstart'){
    after(1500, pressStart);
    after(2150, () => { setScreen('oncharge'); S.phase='charging'; S.ledTarget.setHex(P.brand); });
  }

  // ekrani i karikuesit e thone cfare duhet bere. Mbetet vetem konfirmimi.
  document.getElementById('draghint').classList.remove('show');
}

/* ===================== TERHEQJA E SPINES ===================== */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -0.9);
const hit = new THREE.Vector3(), mouse = { x:0, y:0 };
function toNdc(e){
  const r = canvas.getBoundingClientRect();
  ptr.x = ((e.clientX-r.left)/r.width)*2-1;
  ptr.y = -((e.clientY-r.top)/r.height)*2+1;
  mouse.x = ptr.x; mouse.y = ptr.y;
}
canvas.addEventListener('pointerdown', e=>{
  if (chapter!==CH.connect || S.connected) return;
  toNdc(e); ray.setFromCamera(ptr, camera);
  if (!ray.intersectObjects(plug.children,false).length){
    const sp = plug.position.clone().project(camera);
    if (Math.hypot(sp.x-ptr.x, sp.y-ptr.y) > PICK_TOL) return;
  }
  S.dragging = true; S.idle = 0; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  toNdc(e);
  if (!S.dragging) return;
  ray.setFromCamera(ptr, camera);
  if (ray.ray.intersectPlane(dragPlane, hit)){
    plugPos.set(THREE.MathUtils.clamp(hit.x,-4.2,3.4), 0.9, THREE.MathUtils.clamp(hit.z,-2.6,3.4));
    S.idle = 0;
  }
});
function endDrag(e){
  if (!S.dragging) return;
  S.dragging = false;
  if (e?.pointerId!==undefined && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  if (plugPos.distanceTo(heroCar.portWorld) < 0.55) snapPlug();
  else { plugPos.copy(HOME); refreshCable(true); }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

  if (!chapcard.classList.contains('open')) setTimeout(measureCard, 340);
});
window.addEventListener('resize', () => { measureCard(); S.camDirty = true; });
window.addEventListener('orientationchange', () => setTimeout(() => {
  measureCard(); S.camDirty = true;
}, 260));

/* Hapi 1: klikimi mbi telefon hap faqen e pikes menjehere — prezantuesi
   nuk pret timer-in kur publiku e ka kapur idene. */
document.querySelector('.pscreen').addEventListener('click', () => phoneTap());

document.getElementById('btn-fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.body.requestFullscreen || document.body.webkitRequestFullscreen)?.call(document.body);
};

/* 13 kapitujt e rrefimit: 1..0, -, =, [ · 8 kapitujt RadX: ], \, ;, ', , . / ` */
const KEYMAP = ['1','2','3','4','5','6','7','8','9','0','-','=','[',
                ']','\\',';',"'",',','.','/','`'];
window.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); goTo(chapter+1); }
  else if (e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); goTo(chapter-1); }
  else if (KEYMAP.includes(e.key)) goTo(KEYMAP.indexOf(e.key));
  else if (e.key==='f'||e.key==='F'){ document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen(); }
  else if (e.key==='r'||e.key==='R') restart();
  else if (e.key==='t'||e.key==='T') document.getElementById('chapcard').classList.toggle('showtech');
});
function restart(){
  S.connected=false; S.kw=0; S.kwh=0; S.secs=0; S.soc=SOC_START;
  S.graceLeft=GRACE_MIN*60; S.idleFee=0; S.autoDone=false;
  S.cardT=0; S.cardOk=false; tapUsed=false;
  plugPos.copy(HOME); plug.rotation.y=0; refreshCable(true);
  curScreen = null; curMap = null; goTo(0, true);
}

/* ===================== LOOP ===================== */
const clk = new THREE.Clock();
let lastW = 0, lastH = 0;
/* Hapesira e telefonit ne te djathte. Ne portret telefoni shkon POSHTE skenes,
   kështu nuk duhet zhvendosje horizontale. */
function phonePad(){
  if (document.body.classList.contains('wide')) return 0;   // seksioni RadX: pa telefon
  const portrait = window.innerHeight > window.innerWidth;
  if (portrait && window.innerWidth <= 1100) return 0;   // layout i shtresuar
  if (window.innerHeight <= 520) return 105;             // telefon horizontal
  if (window.innerWidth  <= 1280) return 150;
  return 200;
}

/* Skena renditet horizontalisht (3 vende parkimi). Kur aspekti ngushtohet, ne vend
   qe te presim gjeresine, zgjerojme fov-in vertikal — kuadrimi horizontal mbetet i njejti.
   Ne 16:9 dhe me gjere mbetet 42°, keshtu desktop-i nuk preket fare. */
const HFOV_REF = 2*Math.atan(Math.tan(42*Math.PI/360)*(16/9));
const fitFov = a => Math.min(74, 2*Math.atan(Math.tan(HFOV_REF/2)/a)*180/Math.PI);

/* Sa here duhet terhequr kamera qe kuadrimi horizontal te barazoje referencen.
   1.0 kur fov-i nuk ka rene ne kapin e 74°, pra ne desktop dhe ne landscape. */
let camPull = 1;
function updateCamPull(){
  const hfov = 2*Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect);
  camPull = Math.max(1, Math.tan(HFOV_REF/2)/Math.tan(hfov/2));
}

/* ===== Kuadrimi i panelit ne ekran te vogel =====
   Ne desktop paneli ze 45–71% te gjeresise dhe teksti del 12–19px: lexohet.
   Ne telefon i njejti kuadrim jep 3.7–9.1px. Keshtu ne ekran te vogel, dhe
   VETEM per kapitujt me panel, distanca e kameres nuk merret nga CHAPTERS por
   llogaritet: sa duhet qe paneli te mbushe kuadrin. Drejtimi — pjerresia e
   kapitullit — mbetet i njejti. Desktop-i nuk e ndez kete rruge fare. */
const smallScreen   = () => window.innerWidth <= 1100 || window.innerHeight <= 560;
const wantPanelPort = () => smallScreen() && window.innerHeight > window.innerWidth;
let cardClosedH = 0, vShift = 0;
const dirTmp = new THREE.Vector3();

/* Sa px te fundit i ze karta e tekstit. Paneli ngrihet mbi ate zone me
   zhvendosje lente (setViewOffset), pa e pjerresuar kameren — ndryshe plani
   do dilte trapez. Matja merret nga karta e MBYLLUR: hapja e tekstit gjate
   leximit nuk duhet te levize kuadrimin. */
function panelShift(){
  /* Vetem te kapitujt me panel: kapitujt me telefon kane skenen ne 38dvh lart,
     ku karta nuk e mbivendos fare — zhvendosja atje do ta prishte kuadrimin. */
  if (!panelPort || !cardClosedH || !CHAPTERS[chapter].panel) return 0;
  return Math.min(cardClosedH + 10, Math.round(window.innerHeight * 0.34));
}
function measureCard(){
  if (!chapcard || chapcard.classList.contains('open')) return;
  const ch = Math.round(chapcard.getBoundingClientRect().height);
  if (ch && Math.abs(ch - cardClosedH) > 3){ cardClosedH = ch; S.camDirty = true; }
}
/* Distanca ne te cilen paneli mbush 94% te kuadrit te disponueshem. */
function panelFitDist(w, h, vsh){
  const fullH = h + vsh, availH = Math.max(80, h - vsh);
  const k = fullH / (2 * Math.tan(camera.fov * Math.PI / 360));
  /* 0.88 ne gjeresi, jo 0.94: paneli shihet nga lart dhe ka pjerresi -0.06,
     keshtu buza e poshtme (me prane kameres) projektohet deri 8.5% me e gjere
     se sa jep llogaria e planit ballas. Matur ne kapitullin 20, kamera me e larta. */
  return Math.max(panelDim.h * k / (0.93 * availH),
                  panelDim.w * k / (0.88 * Math.max(1, w)));
}

function frame(){
  const dt = Math.min(clk.getDelta(), 0.1);

  /* resize + hapesira e telefonit ne te djathte */
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w!==lastW || h!==lastH || S.camDirty){
    lastW = w; lastH = h; S.camDirty = false;
    renderer.setSize(w,h,false);
    applyPanelMode(wantPanelPort());
    applyWide();
    const pad = phonePad();
    const vsh = panelShift();
    vShift = vsh;
    if (pad > 0){
      camera.aspect = (w + 2*pad)/Math.max(1,h);
      camera.setViewOffset(w + 2*pad, h, 2*pad, 0, w, h);
    } else if (vsh > 0){
      camera.aspect = w/Math.max(1, h + vsh);
      camera.setViewOffset(w, h + vsh, 0, vsh, w, h);
    } else {
      camera.aspect = w/Math.max(1,h);
      camera.clearViewOffset();
    }
    camera.fov = camera.aspect < 16/9 ? fitFov(camera.aspect) : 42;
    camera.updateProjectionMatrix();
    updateCamPull();
  }

  /* kamera */
  if (progT < 1){
    progT = Math.min(1, progT + dt/PROG_DUR);
    progress = progFrom + (progTo-progFrom)*easeIO(progT);
  }
  const base = camCurve.getPoint(progress);
  const seg = progress*(N-1), si = Math.min(N-2, Math.floor(seg));
  lookNow.lerpVectors(lookPts[si], lookPts[si+1], easeIO(Math.min(1, seg-si)));

  /* Sa "kthyer nga paneli" jemi: 0 ne kapitujt pa panel, 1 ne ata me panel,
     me kalim te zbutur brenda segmentit — pa kete kamera do kerceje ne 11→12. */
  let panelFocus = 0;
  if (smallScreen()){
    const a = CHAPTERS[si].panel ? 1 : 0, b = CHAPTERS[si+1].panel ? 1 : 0;
    panelFocus = a + (b - a)*easeIO(Math.min(1, Math.max(0, seg - si)));
  }
  if (panelFocus > 0.001){
    dirTmp.copy(base).sub(PANEL_AT);
    if (dirTmp.lengthSq() < 1e-6) dirTmp.set(0, 0.15, 1);
    dirTmp.normalize().multiplyScalar(panelFitDist(w, h, vShift)).add(PANEL_AT);
    base.lerp(dirTmp, panelFocus);
    lookNow.lerp(PANEL_AT, panelFocus);
  } else if (camPull > 1.001 && CHAPTERS[chapter].sec === 'RadX'){
    /* Terheqja aplikohet vetem ne seksionin RadX, dhe vetem kur portreti e ka
       ngushtuar kuadrimin. Jashte tij base mbetet pikerisht vlera e CHAPTERS. */
    base.sub(lookNow).multiplyScalar(camPull).add(lookNow);
  }
  camera.position.set(base.x + mouse.x*0.30, base.y - mouse.y*0.15, base.z);
  camera.lookAt(lookNow);

  /* LED-et */
  S.ledColor.lerp(S.ledTarget, Math.min(1, dt*3.2));
  const puls = S.phase==='charging' ? 1.35 + Math.sin(clk.elapsedTime*3.4)*0.45 : 1.5;
  stations[0].led.material.emissive.copy(S.ledColor);
  stations[0].led.material.emissiveIntensity = puls;
  stations[0].glow.color.copy(S.ledColor);

  /* stacioni me problem */
  S.fault += ((chapter===CH.problem ? 1 : 0) - S.fault) * Math.min(1, dt*3);
  const faultOn = S.fault > 0.5;
  const blink = 0.7 + Math.sin(clk.elapsedTime*6)*0.6;
  stations[2].led.material.emissive.setHex(faultOn ? P.bad : (S.side>0.4 ? P.brand : 0xffffff));
  stations[2].led.material.emissiveIntensity = faultOn ? blink : 1.5;
  stations[2].glow.color.setHex(faultOn ? P.bad : (S.side>0.4 ? P.brand : 0xffffff));
  stations[1].led.material.emissive.setHex(S.side>0.4 ? P.brand : 0xffffff);
  stations[1].glow.color.setHex(S.side>0.4 ? P.brand : 0xffffff);

  /* kapitulli i lidhjes: ndihmesa e terheqjes */
  const inConnect = chapter===CH.connect && !S.connected;
  if (inConnect && !S.dragging){
    S.idle += dt;
    if (S.idle > AUTO_S && !S.autoDone){
      S.autoDone = true;
      const from = plugPos.clone(), to = heroCar.portWorld.clone().add(new THREE.Vector3(-0.16,0,0));
      let t = 0;
      const glide = ()=>{
        t = Math.min(1, t+0.02);
        plugPos.lerpVectors(from, to, easeIO(t));
        plugPos.y = 0.9 + Math.sin(t*Math.PI)*0.18;
        refreshCable();
        t<1 ? requestAnimationFrame(glide) : snapPlug();
      };
      glide();
    }
  }
  const wantRing = inConnect ? (0.60 + Math.sin(clk.elapsedTime*3)*0.30) : 0;
  S.ring += (wantRing - S.ring) * Math.min(1, dt*5);
  heroCar.ringMat.opacity = S.ring;
  heroCar.ring.scale.setScalar(1 + Math.sin(clk.elapsedTime*3)*0.07);
  heroCar.ring.lookAt(camera.position);
  heroCar.markMat.opacity = S.ring*1.05;
  heroCar.mark.visible = S.ring > 0.02;
  heroCar.mark.position.y = 0.88 + Math.sin(clk.elapsedTime*2.4)*0.05;

  /* spina + kablli */
  plug.position.lerp(plugPos, Math.min(1, dt*(S.connected?10:18)));
  refreshCable();

  /* simulimi */
  if (S.phase==='charging' && S.connected){
    const free = S.soc > 80 ? 62 - (S.soc-80)*1.6 : 62;
    S.kw += ((chapter>=CH.shared ? 55 : free) - S.kw) * Math.min(1, dt*0.9);
    S.kwh += S.kw * dt * SPEED / 3600;
    S.secs += dt * SPEED;
    S.soc = Math.min(100, SOC_START + (S.kwh/BATTERY)*100);
    if (S.soc >= 100 && chapter===CH.charging) S.phase = 'topped';
    S.pulse += (0.95 - S.pulse) * Math.min(1, dt*3);
  } else if (S.phase==='full'){
    if (S.graceLeft > 0) S.graceLeft = Math.max(0, S.graceLeft - dt*SPEED);
    else S.idleFee += (dt*SPEED/60) * IDLE_FEE;
    S.kw += (0 - S.kw) * Math.min(1, dt*2.5);
    S.pulse += (0 - S.pulse) * Math.min(1, dt*3);
  } else {
    S.kw += (0 - S.kw) * Math.min(1, dt*2.5);
    S.pulse += (0 - S.pulse) * Math.min(1, dt*3);
  }

  pulseMat.opacity = S.pulse;
  if (S.pulse > 0.02 && cableCurve){
    const sp = clk.elapsedTime*0.34;
    pulses.forEach((p,i)=>{ p.position.copy(cableCurve.getPoint((sp+i/pulses.length)%1)); p.visible = true; });
  } else pulses.forEach(p=> p.visible = false);

  /* sesionet e tjera */
  S.side += ((chapter>=CH.shared ? 1 : 0) - S.side) * Math.min(1, dt*2.4);
  sideCables.forEach(c=>{ c.material.opacity = S.side; c.visible = S.side>0.02; });

  /* paneli */
  S.panel += ((chapter>=CH.panel ? 1 : 0) - S.panel) * Math.min(1, dt*2.6);
  panelMat.opacity = S.panel; frameMat.opacity = S.panel*0.95;
  panel.visible = panelFrame.visible = S.panel > 0.02;
  panel.position.y = panelDim.y + Math.sin(clk.elapsedTime*0.8)*0.045;
  panelFrame.position.y = panel.position.y;

  /* karta RFID: nje goditje me fund, jo cikel pa fund. Ciklikja lexohej si
     dekor; keshtu lexohet si veprim, dhe suksesi ka moment te vetin. */
  const onCard = chapter === CH.card;
  S.cardOp += ((onCard ? 1 : 0) - S.cardOp) * Math.min(1, dt*4);
  cardMat.opacity = stripeMat.opacity = chipMat.opacity = S.cardOp;
  card.visible = S.cardOp > 0.02;
  if (onCard){
    S.cardT = Math.min(1, S.cardT + dt*0.46);          /* ~2.2 s i gjithe timeline-i */
    const t = S.cardT;
    card.position.lerpVectors(CARD_FAR, CARD_NEAR, easeIO(Math.min(1, t/0.40)));
    if (t > 0.40) card.position.lerp(CARD_FAR, easeIO(Math.min(1, (t-0.40)/0.42))*0.5);
    card.position.y += Math.sin(clk.elapsedTime*2.2)*0.008;
    card.rotation.set(-0.14, -0.16, -0.05);

    if (t >= 0.40 && !S.cardOk) cardAccepted();

    /* Unaza e suksesit: jeshile, e vetme, jo pulsuese — ndodhi njehere. */
    if (S.cardOk){
      const rp = Math.min(1, (t-0.40)/0.46);
      tapMat.color.setHex(P.brand);
      tapMat.opacity = (1-rp)*0.9;
      tapRing.scale.setScalar(0.7 + rp*2.6);
      tapRing.visible = rp < 0.999;
    } else tapRing.visible = false;
  } else {
    tapRing.visible = false;
    if (!onCard) S.cardT = 0;
  }

  /* ekranet e karikuesve */
  const ID0 = 'RDX-014 · C1';
  if      (S.phase==='idle')     stations[0].screen.draw('I LIRË','—','#10a2ac',ID0);
  else if (S.phase==='auth')     stations[0].screen.draw('AFRO KARTËN','Po kontrollohet','#2f9bff',ID0);
  else if (S.phase==='start')    stations[0].screen.draw('PO NIS','Prit një moment','#2f9bff',ID0);
  else if (S.phase==='connect')  stations[0].screen.draw(S.connected?'LIDHUR':'LIDH SPINËN',
                                   S.connected?'AFRO KARTELËN':'Fut spinën','#2f9bff',ID0);
  else if (S.phase==='ok')       stations[0].screen.draw('✓ E PRANUAR','Karikimi nis','#7fbc42',ID0);
  else if (S.phase==='charging') stations[0].screen.draw('KARIKON', Math.round(S.kw)+' kW','#7fbc42',ID0);
  else if (S.phase==='topped'||S.phase==='full') stations[0].screen.draw('BATERIA PLOT','100%','#f0a33a',ID0);
  else                           stations[0].screen.draw('MBARUAR', S.kwh.toFixed(1)+' kWh','#10a2ac',ID0);

  const on = S.side > 0.4;
  stations[1].screen.draw(on?'KARIKON':'I LIRË', on?'52 kW':'—', on?'#7fbc42':'#10a2ac','RDX-014 · C2');
  stations[2].screen.draw(faultOn?'PA LIDHJE': (on?'KARIKON':'I LIRË'),
                          faultOn?'Nuk përgjigjet': (on?'43 kW':'—'),
                          faultOn?'#e2564a': (on?'#7fbc42':'#10a2ac'), 'RDX-021 · C1');

  /* ===== TELEFONI: numrat live mbi pamjet e app-it =====
     App-i real shfaq perqindje, kilometra dhe kohe-per-te-mbaruar — jo kW e kosto.
     Kete gjuhe ndjekim: teksti i kapitullit e mban shpjegimin, ekrani mban numrin. */
  const cost = S.kwh*TARIFF;
  if (curMap && curMap.live === 'charging'){
    const km = Math.round(S.soc/100*RANGE_KM);
    document.getElementById('ov-big').textContent = Math.round(S.soc)+'% — '+km+' Km';
    const left = Math.max(0, (100-S.soc)/100*BATTERY);
    document.getElementById('ov-sub').textContent =
      S.kw > 0.5 ? clockH(left/S.kw*3600)+' to finish' : 'starting…';
    setArc(S.soc/100);
  }
  if (curMap && curMap.live === 'full'){
    document.getElementById('ov-big').textContent = '100% — '+RANGE_KM+' Km';
    document.getElementById('ov-sub').textContent = clock(S.graceLeft)+' free to move';
    setArc(1);
  }
  if (curMap && curMap.ov === 'done'){
    document.getElementById('ov-kwh').textContent  = S.kwh.toFixed(1);
    document.getElementById('ov-cost').textContent = L(cost);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ===================== NISJA ===================== */
measureCard();
goTo(0, true);
requestAnimationFrame(frame);
setTimeout(()=> document.getElementById('boot').classList.add('hide'), 420);

window.__demo = { goTo, restart, snapPlug, S, CHAPTERS, CH, phoneTap, camera, scene, renderer, plug, plugPos, heroCar, stations, panel, setPanelPage,
                  setScreen, get screen(){ return curScreen; },
                  get panelPort(){ return panelPort; },
                  get panelDim(){ return panelDim; },
                  get vShift(){ return vShift; },
                  get cardClosedH(){ return cardClosedH; },
                  panelFrame, THREE };

window.addEventListener('beforeunload', ()=>{
  track.forEach(o => o.dispose && o.dispose());
  cableMesh?.geometry.dispose();
  renderer.dispose();
});
</script>
